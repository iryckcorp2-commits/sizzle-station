<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Station — Kitchen Rush</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f5257; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh;
         font-family: sans-serif; color: #e8f5e9; }
  h1 { margin: 14px 0 4px; font-size: 22px; letter-spacing: 1px; }
  p.sub { margin: 0 0 10px; font-size: 13px; color: #bfe3e0; }
  canvas { background: #f7ead7; border: 4px solid #083638; border-radius: 10px;
           max-width: 96vw; max-height: 86vh; }
  p.help { margin: 10px 0 16px; font-size: 13px; color: #bfe3e0; text-align: center; }
</style>
</head>
<body>
<h1>SIZZLE STATION — Kitchen Rush</h1>
<p class="sub">An original timed cooking game. Works fully offline — no network requests.</p>
<canvas id="game" width="1280" height="800"></canvas>
<p class="help">Click ingredient bins or press 1-6 &nbsp;•&nbsp; Space to serve &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M sound &nbsp;•&nbsp; R restart</p>
<noscript>This game needs JavaScript enabled.</noscript>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/world.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
